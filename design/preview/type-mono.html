<!doctype html>
<html><head><meta charset="utf-8"><title>Mono / numeric</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .big { font-family: var(--font-body); font-weight: 800; font-variant-numeric: tabular-nums; font-size: 36px; }
  .timer { font-family: var(--font-mono); font-size: 28px; }
</style></head>
<body>
  <div class="row"><div class="big">124 / 160</div><div class="meta">Nunito 800 · tabular nums · HP</div></div>
  <div class="row"><div class="timer" style="color: var(--fox-core)">0:24</div><div class="meta">JetBrains Mono · wave timer</div></div>
  <div class="row"><div class="mono" style="font-size: 14px">seed: 4F-honk-9182-buffalo</div><div class="meta">14px · run seed</div></div>
</body></html>
