<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 22px; font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 110px; }
  .bar { height: 14px; background: var(--fox-core); border-radius: 3px; }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
</style></head>
<body>
  <div class="row"><div class="label">--space-1</div><div class="bar" style="width: 4px"></div><div class="v">4px</div></div>
  <div class="row"><div class="label">--space-2</div><div class="bar" style="width: 8px"></div><div class="v">8px</div></div>
  <div class="row"><div class="label">--space-3</div><div class="bar" style="width: 12px"></div><div class="v">12px</div></div>
  <div class="row"><div class="label">--space-4</div><div class="bar" style="width: 16px"></div><div class="v">16px · default gap</div></div>
  <div class="row"><div class="label">--space-5</div><div class="bar" style="width: 24px"></div><div class="v">24px · HUD safe inset</div></div>
  <div class="row"><div class="label">--space-6</div><div class="bar" style="width: 32px"></div><div class="v">32px</div></div>
  <div class="row"><div class="label">--space-7</div><div class="bar" style="width: 48px"></div><div class="v">48px</div></div>
  <div class="row"><div class="label">--space-8</div><div class="bar" style="width: 64px"></div><div class="v">64px</div></div>
</body></html>
