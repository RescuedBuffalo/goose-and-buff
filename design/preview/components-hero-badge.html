<!doctype html>
<html><head><meta charset="utf-8"><title>Hero badge</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 24px; font-family: var(--font-body); display: flex; gap: 14px; }
  .badge {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--night-1); border: var(--hairline); border-radius: var(--radius-3);
    padding: 10px 14px; box-shadow: var(--inset-warm);
  }
  .badge img { width: 36px; height: 36px; }
  .badge .name { font-family: var(--font-display); font-size: 16px; }
  .badge .stat { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .stripe { width: 4px; align-self: stretch; border-radius: 2px; }
</style></head>
<body>
  <div class="badge"><div class="stripe" style="background: var(--goose-core)"></div><img src="../assets/totems/goose.svg"><div><div class="name">Goose</div><div class="stat">100 hp · 18 spd</div></div></div>
  <div class="badge"><div class="stripe" style="background: var(--buffalo-core)"></div><img src="../assets/totems/buffalo.png"><div><div class="name">Buffalo</div><div class="stat">160 hp · 12 spd</div></div></div>
  <div class="badge"><div class="stripe" style="background: var(--fox-core)"></div><img src="../assets/totems/fox.svg"><div><div class="name">Fox</div><div class="stat">85 hp · 22 spd</div></div></div>
</body></html>
