<!doctype html>
<html><head><meta charset="utf-8"><title>Body type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); white-space: nowrap; }
</style></head>
<body>
  <div class="row"><div class="h3">Buffalo's holding steady</div><div class="meta">Nunito 800 · 26px / h3</div></div>
  <div class="row"><div class="lead">Goose is down. Val's circling — give him a sec.</div><div class="meta">20px / lead</div></div>
  <div class="row"><p style="margin: 0">We held the line through wave four. Fox took two cores worth of pressure on the left. The plan held.</p><div class="meta">16px / body</div></div>
  <div class="row"><div class="small">tap to dismiss</div><div class="meta">14px / small</div></div>
  <div class="row"><div class="eyebrow">Wave 3 · Fox's turn</div><div class="meta">12px / eyebrow caps</div></div>
</body></html>
