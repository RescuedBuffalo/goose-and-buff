<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows & elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 28px; font-family: var(--font-body); }
  .row { display: flex; gap: 18px; }
  .item { text-align: center; flex: 1; }
  .box { background: var(--night-1); border: var(--hairline); height: 72px; border-radius: var(--radius-3); margin-bottom: 10px; }
  .name { font-family: var(--font-display); font-size: 14px; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow: var(--shadow-1)"></div><div class="name">shadow-1</div><div class="v">resting card</div></div>
    <div class="item"><div class="box" style="box-shadow: var(--shadow-2)"></div><div class="name">shadow-2</div><div class="v">hover / lift</div></div>
    <div class="item"><div class="box" style="box-shadow: var(--shadow-3)"></div><div class="name">shadow-3</div><div class="v">dialog / overlay</div></div>
    <div class="item"><div class="box" style="box-shadow: var(--inset-warm); background: var(--night-2)"></div><div class="name">inset-warm</div><div class="v">"lit by lantern"</div></div>
  </div>
</body></html>
