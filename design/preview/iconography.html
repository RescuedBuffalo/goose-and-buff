<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 22px; font-family: var(--font-body); }
  .row { display: flex; gap: 18px; align-items: center; padding: 6px 0; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); width: 90px; }
  .icons { display: flex; gap: 14px; flex: 1; }
  .icons svg { stroke: var(--fg-1); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .totem-row img { width: 28px; height: 28px; }
</style></head>
<body>
  <div class="row">
    <div class="label">totem · solid</div>
    <div class="icons totem-row">
      <img src="../assets/totems/goose.svg">
      <img src="../assets/totems/buffalo.png">
      <img src="../assets/totems/fox.svg">
      <img src="../assets/totems/val.svg">
    </div>
  </div>
  <div class="row">
    <div class="label">glyph · Lucide</div>
    <div class="icons">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 L12 22 M2 12 L22 12"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12 L19 12 M13 6 L19 12 L13 18"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 12 L12 3 L21 12 M5 10 L5 21 L19 21 L19 10"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3 L12 6 M12 18 L12 21 M3 12 L6 12 M18 12 L21 12"/></svg>
    </div>
  </div>
  <div class="row">
    <div class="label">sizes</div>
    <div class="icons" style="align-items: center">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12"/></svg>
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12"/></svg>
      <svg width="32" height="32" viewBox="0 0 24 24"><path d="M20 6 L9 17 L4 12"/></svg>
      <span style="font-family: var(--font-mono); font-size: 10px; color: var(--fg-3)">16 · 20 · 24 · 32</span>
    </div>
  </div>
</body></html>
