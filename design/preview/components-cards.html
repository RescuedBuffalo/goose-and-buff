<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 22px; font-family: var(--font-body); display: flex; gap: 14px; }
  .card {
    flex: 1; background: var(--night-1); border-radius: var(--radius-3);
    border: var(--hairline); box-shadow: var(--shadow-2), var(--inset-warm);
    padding: 16px;
  }
  .card .eyebrow { color: var(--fg-3); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  .card .title { font-family: var(--font-display); font-size: 20px; margin-bottom: 4px; }
  .card .body { font-size: 13px; color: var(--fg-2); line-height: 1.5; }
  .hero-card { position: relative; border-top: 1px solid var(--fox-core); }
  .hero-card .strip { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--fox-core); border-radius: var(--radius-3) var(--radius-3) 0 0; }
  .goose-card { border-top-color: var(--goose-core); }
  .goose-card .strip { background: var(--goose-core); }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Default</div>
    <div class="title">Cozy night den</div>
    <div class="body">Card on night-1 with hairline border, shadow-2 drop, and inset-warm lantern strip on top.</div>
  </div>
  <div class="card hero-card">
    <div class="strip"></div>
    <div class="eyebrow" style="color: var(--fox-core)">Fox</div>
    <div class="title">Hero-themed</div>
    <div class="body">Same card, retinted with a 1px hero accent on top. Body stays neutral.</div>
  </div>
  <div class="card hero-card goose-card">
    <div class="strip"></div>
    <div class="eyebrow" style="color: var(--goose-core)">Goose</div>
    <div class="title">Goose hour</div>
    <div class="body">The accent strip is the only tinted surface — never tint the whole card.</div>
  </div>
</body></html>
