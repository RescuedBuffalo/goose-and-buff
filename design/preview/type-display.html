<!doctype html>
<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 24px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 6px 0; border-bottom: var(--hairline); }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); white-space: nowrap; }
</style></head>
<body>
  <div class="row"><div class="h-display" style="font-size: 56px">Three Animals</div><div class="meta">Young Serif · 88px / display</div></div>
  <div class="row"><div class="h1" style="font-size: 38px">One Den</div><div class="meta">46px / h1</div></div>
  <div class="row"><div class="h2" style="font-size: 28px">A Wave Approaches</div><div class="meta">34px / h2</div></div>
</body></html>
