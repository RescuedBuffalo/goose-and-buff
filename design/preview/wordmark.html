<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); color: var(--fg-1); padding: 28px; font-family: var(--font-body); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .mark { font-family: var(--font-display); font-size: 48px; line-height: 1; }
  .amp { color: var(--fox-core); font-weight: 400; }
  .feat { font-family: var(--font-body); font-weight: 700; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body>
  <div class="mark">The Long <span class="amp">Watch</span></div>
  <div class="feat">Goose · Buffalo · Fox &mdash; with Val on the flank</div>
</body></html>
