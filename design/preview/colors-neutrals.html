<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); font-family: var(--font-body); color: var(--fg-1); padding: 20px; }
  .group { margin-bottom: 14px; }
  .group:last-child { margin-bottom: 0; }
  .group-label { font-family: var(--font-body); font-weight: 700; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  .swatch { flex: 1; height: 52px; border-radius: var(--radius-2); padding: 6px 10px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; }
</style></head>
<body>
  <div class="group">
    <div class="group-label">Night — for app/HUD ground</div>
    <div class="row">
      <div class="swatch" style="background: var(--night-0); color: var(--fg-2)">night-0<span>18 17 22</span></div>
      <div class="swatch" style="background: var(--night-1); color: var(--fg-2)">night-1<span>28 26 33</span></div>
      <div class="swatch" style="background: var(--night-2); color: var(--fg-2)">night-2<span>40 37 47</span></div>
      <div class="swatch" style="background: var(--night-3); color: var(--fg-2)">night-3<span>58 53 66</span></div>
      <div class="swatch" style="background: var(--night-4); color: var(--fg-1)">night-4<span>82 75 92</span></div>
    </div>
  </div>
  <div class="group">
    <div class="group-label">Parchment — for warm light surfaces</div>
    <div class="row">
      <div class="swatch" style="background: var(--parchment-0); color: var(--parchment-ink)">parchment-0<span>252 244 226</span></div>
      <div class="swatch" style="background: var(--parchment-1); color: var(--parchment-ink)">parchment-1<span>245 232 208</span></div>
      <div class="swatch" style="background: var(--parchment-2); color: var(--parchment-ink)">parchment-2<span>232 215 184</span></div>
      <div class="swatch" style="background: var(--parchment-ink); color: var(--parchment-0)">ink<span>46 32 22</span></div>
    </div>
  </div>
</body></html>
