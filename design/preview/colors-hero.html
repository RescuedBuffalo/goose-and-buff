<!doctype html>
<html><head><meta charset="utf-8"><title>Hero palettes</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--night-0); font-family: var(--font-body); color: var(--fg-1); padding: 20px; }
  .row { display: flex; gap: 12px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .label { width: 80px; font-family: var(--font-display); font-size: 16px; align-self: center; }
  .swatch { flex: 1; height: 56px; border-radius: var(--radius-2); display: flex; align-items: flex-end; padding: 6px 10px; font-family: var(--font-mono); font-size: 10px; }
  .floor { color: rgb(80 50 20 / 0.7); }
  .core { color: rgb(255 255 255 / 0.85); }
  .ink { color: rgb(255 255 255 / 0.6); border: 1px dashed rgb(255 255 255 / 0.15); }
</style></head>
<body>
  <div class="row">
    <div class="label">Goose</div>
    <div class="swatch floor" style="background: var(--goose-floor)">floor · 255 248 190</div>
    <div class="swatch core" style="background: var(--goose-core); color: rgb(80 50 20)">core · 252 222 40</div>
    <div class="swatch ink" style="background: var(--goose-ink)">ink · 120 88 12</div>
  </div>
  <div class="row">
    <div class="label">Buffalo</div>
    <div class="swatch core" style="background: var(--buffalo-floor)">floor · 150 100 70</div>
    <div class="swatch core" style="background: var(--buffalo-core)">core · 110 70 40</div>
    <div class="swatch floor" style="background: var(--buffalo-ink)">ink · 245 230 210</div>
  </div>
  <div class="row">
    <div class="label">Fox</div>
    <div class="swatch core" style="background: var(--fox-floor); color: rgb(80 30 5)">floor · 255 185 100</div>
    <div class="swatch core" style="background: var(--fox-core)">core · 248 130 30</div>
    <div class="swatch ink" style="background: var(--fox-ink)">ink · 60 20 5</div>
  </div>
  <div class="row">
    <div class="label">Val</div>
    <div class="swatch core" style="background: var(--val-merle)">merle · 94 110 130</div>
    <div class="swatch floor" style="background: var(--val-cream)">cream · 238 226 200</div>
    <div class="swatch core" style="background: var(--val-rust)">rust · 170 92 56</div>
  </div>
</body></html>
